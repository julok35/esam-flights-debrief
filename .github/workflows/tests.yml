name: Tests
on: [push, pull_request]
jobs:
  test:
    # Version fixée : Playwright 1.56.1 n'installe pas Chromium sur Ubuntu 26.04, devenu ubuntu-latest.
    # À relever en même temps que @playwright/test.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
